<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aula Virtual - Ruleta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #contenedor-principal {
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
      max-width: 900px;
      width: 100%;
    }

    /* ── Sección izquierda: ruleta ── */
    #seccion-ruleta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #caja-respuesta {
      width: 320px;
      min-height: 40px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      background: #fff;
      padding: 6px 10px;
      text-align: center;
      word-break: break-word;
    }

    #etiqueta-respuesta {
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    #contenedor-ruleta {
      position: relative;
      width: 320px;
      height: 320px;
      cursor: pointer;
    }

    #canvas-ruleta { display: block; }

    /* triángulo indicador */
    #indicador {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-right: 22px solid #cc0000;
      pointer-events: none;
    }

    #texto-girar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(50, 50, 50, 0.75);
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 15px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Sección derecha: controles ── */
    #seccion-controles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 220px;
    }

    #fila-botones { display: flex; gap: 8px; }

    #btn-iniciar {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #btn-iniciar:hover { background: #1558b0; }

    #btn-reiniciar {
      background: #fff;
      color: #c62828;
      border: 2px solid #c62828;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #btn-reiniciar:hover { background: #fce4e4; }

    /* Editor de elementos (reemplaza al textarea) */
    #editor-elementos {
      width: 220px;
      height: 220px;
      border: 1px solid #aaa;
      padding: 6px;
      font-size: 14px;
      overflow-y: auto;
      background: #fff;
      outline: none;
      cursor: default;
      user-select: none;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #editor-elementos.modo-edicion {
      cursor: text;
      user-select: text;
      border-color: #1a73e8;
    }

    /* Línea individual dentro del editor */
    .linea-elemento {
      min-height: 1.4em;
      padding: 0 2px;
    }
    /* Resaltado gris para elementos ocultos (F6) */
    .linea-elemento.oculto {
      background-color: #b0b0b0;
      color: #555;
    }

    #fila-acciones { display: flex; gap: 6px; }
    #fila-acciones button {
      border: 1px solid #aaa;
      background: #f5f5f5;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 3px;
    }
    #fila-acciones button:hover { background: #e0e0e0; }

    #leyenda-teclas {
      font-size: 13px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #leyenda-teclas span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tecla {
      display: inline-block;
      background: #e8e8e8;
      border: 1px solid #999;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="contenedor-principal">

  <!-- Izquierda: ruleta -->
  <div id="seccion-ruleta">
    <div id="etiqueta-respuesta">RESPUESTA</div>
    <div id="caja-respuesta">&nbsp;</div>

    <div id="contenedor-ruleta">
      <canvas id="canvas-ruleta" width="320" height="320"></canvas>
      <div id="indicador"></div>
      <div id="texto-girar">haz clic para girarlo</div>
    </div>
  </div>

  <!-- Derecha: controles -->
  <div id="seccion-controles">
    <div id="fila-botones">
      <button id="btn-iniciar">Iniciar</button>
      <button id="btn-reiniciar">Reiniciar</button>
    </div>

    <!-- div contenteditable reemplaza al textarea para soportar colores por línea -->
    <div id="editor-elementos" contenteditable="false" spellcheck="false"></div>

    <div id="fila-acciones">
      <button id="btn-titulo">Título</button>
      <button id="btn-editar">Editar</button>
      <button id="btn-esconder">esconder...</button>
    </div>

    <div id="leyenda-teclas">
      <span><span class="tecla">SPACE</span> Gíralo</span>
      <span><span class="tecla">S</span> Ocultar el elemento seleccionado</span>
      <span><span class="tecla">R</span> Reiniciar</span>
      <span><span class="tecla">E</span> Editar</span>
    </div>
  </div>

</div>

<script>
  // ─── Constantes ───────────────────────────────────────────────
  const COLORES_BASE     = ['#e57373', '#81c784', '#64b5f6', '#ffb74d', '#ba68c8'];
  const CLAVE_STORAGE    = 'ruleta_elementos';
  const DURACION_GIRO_MS = 3000;

  // ─── Referencias al DOM ───────────────────────────────────────
  const canvas           = document.getElementById('canvas-ruleta');
  const ctx              = canvas.getContext('2d');
  const editorElem       = document.getElementById('editor-elementos');
  const cajaRespuesta    = document.getElementById('caja-respuesta');
  const btnIniciar       = document.getElementById('btn-iniciar');
  const btnReiniciar     = document.getElementById('btn-reiniciar');
  const btnEditar        = document.getElementById('btn-editar');
  const btnEsconder      = document.getElementById('btn-esconder');
  const textoGirar       = document.getElementById('texto-girar');
  const contenedorRuleta = document.getElementById('contenedor-ruleta');

  // ─── Estado ───────────────────────────────────────────────────
  let elementosOcultos = new Set();
  let estaGirando      = false;
  let anguloActual     = 0;
  let ultimoSorteado   = -1;
  let modoEdicion      = false;

  // ─── Leer líneas actuales del editor ─────────────────────────
  function obtenerLineasTexto() {
    // Leer desde los divs hijos para máxima consistencia
    const divs = editorElem.querySelectorAll('.linea-elemento');
    if (divs.length > 0) {
      return Array.from(divs)
        .map(d => d.textContent.trim())
        .filter(t => t.length > 0);
    }
    // Durante edición activa el navegador puede no tener .linea-elemento
    return editorElem.innerText
      .split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0);
  }

  function obtenerElementosVisibles() {
    return obtenerLineasTexto()
      .map((texto, idx) => ({ texto, idx }))
      .filter(e => !elementosOcultos.has(e.idx));
  }

  // ─── Renderizar el editor con divs por línea ──────────────────
  function renderizarEditor(lineas) {
    const scrollAnterior = editorElem.scrollTop;
    editorElem.innerHTML = '';
    lineas.forEach((linea, idx) => {
      const div = document.createElement('div');
      div.className = 'linea-elemento';
      if (elementosOcultos.has(idx)) div.classList.add('oculto');
      div.textContent = linea;
      editorElem.appendChild(div);
    });
    editorElem.scrollTop = scrollAnterior;
  }

  // ─── Guardar / cargar desde localStorage (F4) ────────────────
  function guardarEnStorage() {
    const lineas = obtenerLineasTexto();
    localStorage.setItem(CLAVE_STORAGE, lineas.join('\n'));
  }

  function cargarDesdeStorage() {
    const guardado = localStorage.getItem(CLAVE_STORAGE);
    const texto = guardado !== null
      ? guardado
      : Array.from({ length: 12 }, (_, i) => i + 1).join('\n');
    const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    renderizarEditor(lineas);
    if (guardado === null) guardarEnStorage();
  }

  // ─── Normalizar editor tras edición libre ────────────────────
  function normalizarEditor() {
    // Reconstruye divs limpios leyendo el texto actual
    const texto = editorElem.innerText || '';
    const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    // Resetear ocultos para no aplicar índices obsoletos
    elementosOcultos.clear();
    ultimoSorteado = -1;
    renderizarEditor(lineas);
    guardarEnStorage();
    dibujarRuleta(anguloActual);
  }

  // ─── Habilitar / deshabilitar edición (F7) ───────────────────
  function habilitarEdicion() {
    modoEdicion = true;
    editorElem.contentEditable = 'true';
    editorElem.classList.add('modo-edicion');
    editorElem.focus();
    // Asegurar que Enter cree divs, no brs
    document.execCommand('defaultParagraphSeparator', false, 'div');
  }

  function deshabilitarEdicion() {
    modoEdicion = false;
    editorElem.contentEditable = 'false';
    editorElem.classList.remove('modo-edicion');
    normalizarEditor();
  }

  // Actualización automática de ruleta mientras se escribe (F5)
  editorElem.addEventListener('input', () => {
    if (!modoEdicion) return;
    // Guardar sin re-renderizar (evita perder el cursor)
    const texto = editorElem.innerText || '';
    localStorage.setItem(CLAVE_STORAGE, texto);
    // Redibujar ruleta con el texto actual (sin re-renderizar el editor)
    const lineasTemp = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    dibujarRuletaTemporal(lineasTemp);
  });

  // Click en editor habilita edición (F7)
  editorElem.addEventListener('click', () => {
    if (!modoEdicion) habilitarEdicion();
  });

  // Salir de edición al perder foco
  editorElem.addEventListener('blur', () => {
    if (modoEdicion) deshabilitarEdicion();
  });

  // ─── Helpers para colores ─────────────────────────────────────
  function colorParaIndice(i) {
    return COLORES_BASE[i % COLORES_BASE.length];
  }

  function calcularTamanoFuente(cantidad) {
    if (cantidad <= 6)  return 16;
    if (cantidad <= 12) return 13;
    return 10;
  }

  // ─── Dibujar ruleta ───────────────────────────────────────────
  function dibujarRuleta(anguloBase) {
    dibujarRuletaConElementos(obtenerElementosVisibles(), anguloBase);
  }

  function dibujarRuletaTemporal(lineas) {
    const visibles = lineas.map((texto, idx) => ({ texto, idx }))
      .filter(e => !elementosOcultos.has(e.idx));
    dibujarRuletaConElementos(visibles, anguloActual);
  }

  function dibujarRuletaConElementos(visibles, anguloBase) {
    const total = visibles.length;
    const cx    = canvas.width  / 2;
    const cy    = canvas.height / 2;
    const radio = cx - 4;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (total === 0) {
      ctx.fillStyle = '#ccc';
      ctx.beginPath();
      ctx.arc(cx, cy, radio, 0, 2 * Math.PI);
      ctx.fill();
      return;
    }

    const anguloSector = (2 * Math.PI) / total;

    visibles.forEach((elem, i) => {
      const inicio = anguloBase + i * anguloSector;
      const fin    = inicio + anguloSector;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radio, inicio, fin);
      ctx.closePath();
      ctx.fillStyle = colorParaIndice(i);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(inicio + anguloSector / 2);
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#000';
      ctx.font         = `bold ${calcularTamanoFuente(total)}px Arial`;
      ctx.fillText(elem.texto, radio - 8, 0);
      ctx.restore();
    });

    // Círculo central
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ─── Animación de giro ────────────────────────────────────────
  function girarRuleta() {
    if (estaGirando) return;
    const visibles = obtenerElementosVisibles();
    if (visibles.length === 0) return;

    estaGirando = true;
    textoGirar.style.display = 'none';

    const vueltasExtra  = 5 + Math.random() * 5;
    const anguloDestino = anguloActual + vueltasExtra * 2 * Math.PI;
    const inicio        = performance.now();

    function animar(ahora) {
      const progreso = Math.min((ahora - inicio) / DURACION_GIRO_MS, 1);
      const ease     = 1 - Math.pow(1 - progreso, 3);
      const angulo   = anguloActual + (anguloDestino - anguloActual) * ease;

      dibujarRuleta(angulo);

      if (progreso < 1) {
        requestAnimationFrame(animar);
      } else {
        anguloActual = anguloDestino % (2 * Math.PI);
        estaGirando  = false;
        textoGirar.style.display = '';
        mostrarElementoSeleccionado();
      }
    }

    requestAnimationFrame(animar);
  }

  // ─── Determinar elemento ganador ─────────────────────────────
  function mostrarElementoSeleccionado() {
    const visibles = obtenerElementosVisibles();
    if (visibles.length === 0) return;

    const anguloSector   = (2 * Math.PI) / visibles.length;
    const angNormalizado = ((2 * Math.PI) - (anguloActual % (2 * Math.PI))) % (2 * Math.PI);
    const indiceVisible  = Math.floor(angNormalizado / anguloSector) % visibles.length;
    const seleccionado   = visibles[indiceVisible];

    ultimoSorteado = seleccionado.idx;
    cajaRespuesta.textContent = seleccionado.texto;
  }

  // ─── Ocultar último sorteado con tecla S (F6) ────────────────
  function ocultarUltimoSorteado() {
    if (ultimoSorteado === -1) return;
    elementosOcultos.add(ultimoSorteado);
    // Aplicar clase oculto en el div correspondiente (resaltado gris)
    const divs = editorElem.querySelectorAll('.linea-elemento');
    if (divs[ultimoSorteado]) divs[ultimoSorteado].classList.add('oculto');
    guardarEnStorage();
    dibujarRuleta(anguloActual);
  }

  // ─── Reiniciar ────────────────────────────────────────────────
  function reiniciarRuleta() {
    elementosOcultos.clear();
    ultimoSorteado = -1;
    cajaRespuesta.innerHTML = '&nbsp;';
    // Quitar clase oculto de todos los divs
    editorElem.querySelectorAll('.linea-elemento.oculto')
      .forEach(d => d.classList.remove('oculto'));
    guardarEnStorage();
    dibujarRuleta(anguloActual);
  }

  // ─── Eventos de teclado ───────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    const tecla        = e.key.toUpperCase();
    const editorActivo = modoEdicion && document.activeElement === editorElem;

    if ((e.code === 'Space' || e.key === ' ') && !editorActivo) {
      e.preventDefault();
      girarRuleta();
      return;
    }
    if (tecla === 'S' && !editorActivo) {
      e.preventDefault();
      ocultarUltimoSorteado();
      return;
    }
    if (tecla === 'E' && !editorActivo) {
      e.preventDefault();
      habilitarEdicion();
      return;
    }
    if (e.key === 'Escape' && modoEdicion) {
      editorElem.blur(); // dispara blur → deshabilitarEdicion
      return;
    }
  });

  // ─── Botones ──────────────────────────────────────────────────
  btnIniciar.addEventListener('click',    () => { btnIniciar.blur(); girarRuleta(); });
  btnReiniciar.addEventListener('click',  () => { btnReiniciar.blur(); reiniciarRuleta(); });
  btnEditar.addEventListener('click',     () => {
    btnEditar.blur();
    if (!modoEdicion) habilitarEdicion(); else editorElem.blur();
  });
  btnEsconder.addEventListener('click',   () => { btnEsconder.blur(); ocultarUltimoSorteado(); });
  contenedorRuleta.addEventListener('click', girarRuleta);

  // ─── Inicialización ───────────────────────────────────────────
  cargarDesdeStorage();
  dibujarRuleta(anguloActual);
</script>
</body>
</html>
